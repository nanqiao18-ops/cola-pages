<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苏小七 · 自媒体工作台</title>
<style>
:root{
  --mint:#5BC8A8; --mint-d:#3FA98B; --mint-l:#E9F8F2;
  --cream:#FFFDF6; --yellow:#FFC96B; --yellow-l:#FFF4DB;
  --coral:#FF8A7A; --coral-l:#FFEDE9;
  --sky:#7EC8E3; --sky-l:#E8F6FB;
  --ink:#2E3D39; --ink2:#6B7C77; --ink3:#9AAAA5;
  --line:#E6EFEA; --card:#FFFFFF;
  --shadow:0 10px 24px rgba(91,200,168,.10), 0 2px 6px rgba(46,61,57,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 8% -8%, #E9F8F2 0%, rgba(233,248,242,0) 60%),
    radial-gradient(800px 460px at 100% 0%, #FFF4DB 0%, rgba(255,244,219,0) 55%),
    #FBFDFB;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1080px;margin:0 auto;padding:26px 20px 60px}

/* ---------- 顶栏 ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.logo{
  width:52px;height:52px;border-radius:18px;background:linear-gradient(140deg,#B8EBDC,#5BC8A8);
  display:grid;place-items:center;box-shadow:0 8px 18px rgba(91,200,168,.35);transform:rotate(-6deg)
}
.brand h1{font-size:21px;margin:0;letter-spacing:.4px}
.brand p{margin:3px 0 0;font-size:12.5px;color:var(--ink2)}
.tools{display:flex;gap:8px}
.tools button{
  border:1.5px dashed var(--line);background:#fff;color:var(--ink2);font-size:12.5px;
  padding:9px 14px;border-radius:14px;cursor:pointer;transition:.18s
}
.tools button:hover{border-color:var(--mint);color:var(--mint-d);transform:translateY(-1px)}

/* ---------- 首页卡片 ---------- */
.hero{
  background:linear-gradient(120deg,#FFFFFF 0%,#FFFDF6 100%);
  border:2px solid var(--line);border-radius:26px;padding:20px 22px;margin-bottom:22px;
  box-shadow:var(--shadow);position:relative;overflow:hidden
}
.hero:before{
  content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,#FFF4DB, rgba(255,244,219,0) 70%)
}
.hero h2{margin:0 0 6px;font-size:16px}
.hero p{margin:0;font-size:13.5px;color:var(--ink2);line-height:1.7}
.hero b{color:var(--mint-d)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.card{
  text-align:left;background:var(--card);border:2px solid var(--line);border-radius:24px;
  padding:20px 20px 18px;cursor:pointer;transition:transform .2s ease, box-shadow .2s ease, border-color .2s;
  box-shadow:0 4px 14px rgba(46,61,57,.04);font-family:inherit;position:relative;overflow:hidden
}
.card:hover{transform:translateY(-5px) rotate(-.5deg);border-color:var(--mint);box-shadow:0 16px 28px rgba(91,200,168,.18)}
.card .ic{
  width:46px;height:46px;border-radius:15px;display:grid;place-items:center;margin-bottom:14px;
  transform:rotate(-5deg)
}
.card h3{margin:0 0 6px;font-size:15.5px}
.card p{margin:0;font-size:12.5px;color:var(--ink2);line-height:1.7;min-height:40px;padding-right:8px;word-break:keep-all}
.card .badge{
  position:absolute;right:16px;top:16px;font-size:11px;color:var(--mint-d);
  background:var(--mint-l);border-radius:999px;padding:3px 9px
}
.i-today{background:var(--yellow-l)} .i-topic{background:var(--mint-l)}
.i-script{background:var(--sky-l)} .i-data{background:var(--coral-l)}
.i-plan{background:#F1EEFF} .i-rule{background:#EAF6EE}

/* ---------- 视图 ---------- */
.view{display:none}
.view.on{display:block;animation:pop .28s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.back{
  border:2px solid var(--line);background:#fff;border-radius:14px;padding:9px 14px;cursor:pointer;
  font-size:13px;color:var(--ink2);font-family:inherit;transition:.18s
}
.back:hover{border-color:var(--mint);color:var(--mint-d)}
.view-head h2{margin:0;font-size:18px}
.panel{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h4{margin:0 0 12px;font-size:14px;color:var(--ink)}
.hint{font-size:12.5px;color:var(--ink3);line-height:1.7}

/* ---------- 通用小件 ---------- */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{
  border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;
  color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s
}
.chip.on{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:600}
.row{display:flex;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;font-size:13.5px;line-height:1.5}
.row .m{font-size:11.5px;color:var(--ink3);margin-top:3px}
.pill{
  font-size:11px;border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;
  border:1px solid transparent;white-space:nowrap
}
.p0{background:#F2F5F3;color:var(--ink2)}
.p1{background:var(--yellow-l);color:#9A6B00}
.p2{background:var(--sky-l);color:#2A7E9C}
.p3{background:var(--coral-l);color:#B14E3E}
.btn{
  border:0;background:var(--mint);color:#fff;border-radius:14px;padding:11px 18px;font-size:13px;
  cursor:pointer;font-family:inherit;font-weight:600;transition:.18s;box-shadow:0 6px 14px rgba(91,200,168,.28)
}
.btn:hover{background:var(--mint-d);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{color:var(--mint-d);border-color:var(--mint)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:11px}

/* ---------- 今日 ---------- */
.todo{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.todo:last-child{border-bottom:0}
.box{
  width:20px;height:20px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;
  display:grid;place-items:center;transition:.15s
}
.todo.done .box{background:var(--mint);border-color:var(--mint)}
.todo.done .box:after{content:"";width:6px;height:10px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg) translateY(-1px)}
.todo.done span{color:var(--ink3);text-decoration:line-through}
.progress{height:9px;border-radius:999px;background:#EFF5F1;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#B8EBDC,#5BC8A8);border-radius:999px;transition:width .35s}

/* ---------- 数据 ---------- */
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.form label{font-size:11.5px;color:var(--ink2);display:block;margin-bottom:5px}
.form input,.form select{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13px;
  font-family:inherit;color:var(--ink);background:#FCFEFD;outline:none
}
.form input:focus,.form select:focus{border-color:var(--mint);background:#fff}
.chart{display:flex;align-items:flex-end;gap:16px;height:150px;padding:8px 4px 0;border-bottom:2px solid var(--line)}
.barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:46px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#B8EBDC,#5BC8A8);position:relative;min-height:3px;transition:.3s}
.bar.b2{background:linear-gradient(180deg,#FFE1B8,#FFC96B)}
.barlab{font-size:10.5px;color:var(--ink3);text-align:center;line-height:1.3}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* ---------- 脚本 ---------- */
.script{border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px;background:#fff}
.script .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:999px;padding:3px 10px;background:var(--mint-l);color:var(--mint-d)}
.script h5{margin:0;font-size:14.5px}
.script p{margin:8px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.6}
.script .acts{display:flex;gap:8px;margin-top:12px}

/* ---------- 提词器 ---------- */
.prompter{
  position:fixed;inset:0;background:#111A18;color:#F3F7F4;display:none;z-index:50;
  overflow-y:auto;padding:40px 24px 120px
}
.prompter.on{display:block}
.prompter .ptxt{max-width:720px;margin:0 auto;font-size:30px;line-height:2;letter-spacing:.6px;font-weight:500}
.prompter .ptxt p{margin:0 0 6px}
.prompter .pbar{
  position:fixed;right:20px;bottom:24px;display:flex;gap:8px;background:rgba(255,255,255,.10);
  border-radius:16px;padding:8px;backdrop-filter:blur(6px)
}
.prompter .pbar button{
  border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:11px;padding:9px 13px;
  font-size:13px;cursor:pointer;font-family:inherit
}
.prompter .pbar button:hover{background:rgba(255,255,255,.26)}
.hidden{display:none!important}
@media (max-width:560px){
  .wrap{padding:18px 14px 50px}
  .brand h1{font-size:18px}
  .card p{min-height:auto}
  .prompter .ptxt{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">
      <div class="logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
          <path d="M4 20c0-6 5-11 11-11"/><path d="M15 4c3 0 5 2 5 5-4 0-5-2-5-5z"/><path d="M9 15c-3 0-5-2-5-5 4 0 5 2 5 5z"/>
        </svg>
      </div>
      <div>
        <h1>苏小七 · 自媒体工作台</h1>
        <p id="today"></p>
      </div>
    </div>
    <div class="tools">
      <button id="btnExport">导出备份</button>
      <button id="btnImport">导入备份</button>
      <input type="file" id="fileImport" accept=".json" class="hidden">
    </div>
  </div>

  <!-- ================= 首页 ================= -->
  <div id="home">
    <div class="hero">
      <h2 id="heroTitle"></h2>
      <p id="heroSub"></p>
    </div>
    <div class="grid" id="cardGrid"></div>
  </div>

  <!-- ================= 视图容器 ================= -->
  <div id="view" class="view">
    <div class="view-head">
      <button class="back" id="btnBack">← 返回</button>
      <h2 id="viewTitle"></h2>
    </div>
    <div id="viewBody"></div>
  </div>

</div>

<!-- ================= 提词器 ================= -->
<div class="prompter" id="prompter">
  <div class="ptxt" id="ptxt"></div>
  <div class="pbar">
    <button id="ptMinus">A－</button>
    <button id="ptPlus">A＋</button>
    <button id="ptAuto">自动滚动</button>
    <button id="ptExit">退出</button>
  </div>
</div>

/* ============================================================
   基础
============================================================ */
var $ = function(s){ return document.querySelector(s); };
var KEY = 'suXiaoQi_workbench_v1';
var state = null;

function todayStr(d){
  d = d || new Date();
  var w = ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()) + ' ' + w;
}
function pad(n){ return n < 10 ? '0'+n : ''+n; }

function load(){
  var raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ raw = null; }
  if(raw){
    try { return JSON.parse(raw); } catch(e){}
  }
  return null;
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ console.warn('保存失败', e); }
}

/* ============================================================
   今日
============================================================ */
function todayKey(){ return new Date().toISOString().slice(0,10); }
function todoState(){
  var k = todayKey();
  if(!state.todos[k]) state.todos[k] = {};
  return state.todos[k];
}
function todoDoneCount(){
  var s = todoState(), n = 0;
  for(var i=0;i<TODO_ITEMS.length;i++){ if(s[i]) n++; }
  return n;
}
function renderToday(b){
  var s = todoState();
  var done = todoDoneCount();
  var pct = Math.round(done / TODO_ITEMS.length * 100);

  b.innerHTML =
    '<div class="panel">'+
      '<h4>今天的节奏</h4>'+
      '<div class="progress"><i style="width:'+pct+'%"></i></div>'+
      '<div class="hint">完成 '+done+' / '+TODO_ITEMS.length+'　·　点一下就是打勾</div>'+
      '<div class="todoList" style="margin-top:10px">'+
        TODO_ITEMS.map(function(t,i){
          return '<div class="todo'+(s[i]?' done':'')+'" data-todo="'+i+'"><div class="box"></div><span>'+t+'</span></div>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<div class="panel">'+
      '<h4>今天发什么</h4>'+
      '<div class="hint" style="margin-bottom:10px">从选题库里选一条放进今天；选了会同步到发布排期。</div>'+
      '<select id="pickTopic" style="width:100%;border:1.5px solid #E6EFEA;border-radius:12px;padding:10px;font-size:13px;font-family:inherit">'+
        '<option value="">— 还没选 —</option>'+
        state.topics.map(function(t){
          return '<option value="'+t.id+'"'+(state.schedule[todayKey()]===('#'+t.id+' '+t.title)?' selected':'')+'>'+t.id+'. '+t.title+'</option>';
        }).join('')+
      '</select>'+
    '</div>'+
    '<div class="panel">'+
      '<h4>睡前三个数（记到数据看板）</h4>'+
      '<div class="hint">① 今天最好那条的<b>选题</b>是什么　② 加微信 / 新增关注几个　③ 有没有人掏钱</div>'+
    '</div>';

  b.querySelectorAll('[data-todo]').forEach(function(el){
    el.onclick = function(){
      var i = el.getAttribute('data-todo');
      var s2 = todoState();
      s2[i] = !s2[i];
      save();
      renderToday(b);
    };
  });
  var pick = b.querySelector('#pickTopic');
  if(pick){
    pick.onchange = function(){
      var id = pick.value;
      if(!id){ delete state.schedule[todayKey()]; save(); return; }
      var t = state.topics.filter(function(x){ return String(x.id)===String(id); })[0];
      state.schedule[todayKey()] = '#'+t.id+' '+t.title;
      save();
    };
  }
}

var topicFilter = '全部';
function renderTopics(b){
  var statuses = ['全部','待拍','已拍','已发','爆了'];
  var units = ['全部'];
  state.topics.forEach(function(t){ if(units.indexOf(t.unit)<0) units.push(t.unit); });

  var list = state.topics.filter(function(t){
    return topicFilter==='全部' || t.status===topicFilter;
  });

  b.innerHTML =
    '<div class="panel">'+
      '<h4>按状态筛</h4>'+
      '<div class="chips">'+ statuses.map(function(s){
        return '<button class="chip'+(topicFilter===s?' on':'')+'" data-f="'+s+'">'+s+'</button>';
      }).join('') +'</div>'+
      '<div class="hint">共 '+list.length+' 条。点右边的状态标签可以切换：待拍 → 已拍 → 已发 → 爆了。</div>'+
    '</div>'+
    '<div class="panel">'+
      list.map(function(t){
        var cls = {'待拍':'p0','已拍':'p1','已发':'p2','爆了':'p3'}[t.status] || 'p0';
        return '<div class="row">'+
          '<div class="t">'+t.id+'. '+t.title+
            '<div class="m">'+t.unit+'　·　逻辑：'+t.logic+'　·　避坑点：'+t.pit+'</div>'+
          '</div>'+
          '<span class="pill '+cls+'" data-id="'+t.id+'">'+t.status+'</span>'+
        '</div>';
      }).join('')+
    '</div>';

  b.querySelectorAll('[data-f]').forEach(function(el){
    el.onclick = function(){ topicFilter = el.getAttribute('data-f'); renderTopics(b); };
  });
  b.querySelectorAll('[data-id]').forEach(function(el){
    el.onclick = function(){
      var id = +el.getAttribute('data-id');
      var order = ['待拍','已拍','已发','爆了'];
      var t = state.topics.filter(function(x){ return x.id===id; })[0];
      t.status = order[(order.indexOf(t.status)+1) % order.length];
      save();
      renderTopics(b);
    };
  });
}

};
$('#ptPlus').onclick = function(){ ptFont = Math.min(56, ptFont+3); $('#ptxt').style.fontSize = ptFont+'px'; };
$('#ptMinus').onclick = function(){ ptFont = Math.max(18, ptFont-3); $('#ptxt').style.fontSize = ptFont+'px'; };
$('#ptAuto').onclick = function(){
  if(ptTimer){ clearInterval(ptTimer); ptTimer = null; this.textContent='自动滚动'; }
  else{
    this.textContent = '暂停';
    ptTimer = setInterval(function(){ $('#prompter').scrollTop += 1; }, 60);

};

  if(+r.s5 < 25) return {t:'开头还在赶人：改头五个字，别改选题', c:'#B14E3E'};
  if(r.fin !== '' && +r.fin < 10) return {t:'中段太拖：把中间砍掉三分之一', c:'#9A6B00'};
  if(+r.fans === 0) return {t:'内容行、承接不行：先补主页简介和三置顶', c:'#2A7E9C'};
  return {t:'结构没问题：保持这个开头方式', c:'#3FA98B'};
}

        '<div><label>完播率 %</label><input id="fFin" type="number" placeholder="0"></div>'+
        '<div><label>新增关注</label><input id="fFans" type="number" placeholder="0"></div>'+
        '<div><label>评论数</label><input id="fCmt" type="number" placeholder="0"></div>'+
      '</div>'+
      '<button class="btn" id="btnAdd">记下这条</button>'+
      '<div class="hint" style="margin-top:10px">只填平台上真实能看到的字段：2 秒跳出率、5 秒完播率、完播率、播放、点赞、评论、新增关注。</div>'+
    '</div>'+
    '<div class="panel">'+
      '<h4>最近 6 条趋势</h4>'+
      (last6.length ?
        '<div class="chart">'+ last6.map(function(r){
          var h1 = Math.max(3, Math.min(100, +r.s5 || 0));
          var h2 = Math.max(3, Math.min(100, +r.fin || 0));
          return '<div class="barwrap">'+
            '<div style="display:flex;gap:4px;align-items:flex-end;width:100%;justify-content:center;height:100%">'+
              '<div class="bar" style="height:'+h1+'%"></div>'+
              '<div class="bar b2" style="height:'+h2+'%"></div>'+
            '</div>'+
            '<div class="barlab">'+(r.date||'').slice(5)+'</div>'+
          '</div>';
        }).join('') +'</div>'+
        '<div class="legend"><span><i style="background:#5BC8A8"></i>5 秒完播率</span><span><i style="background:#FFC96B"></i>完播率</span></div>'
        : '<div class="hint">还没有数据。发完第一条，48 小时后回来记一次。</div>')+
    '</div>'+
    '<div class="panel">'+
      '<h4>每条诊断</h4>'+
      (rows.length ? rows.map(function(r,i){
        var d = diag(r);
        return '<div class="row">'+
          '<div class="t">'+(r.title||'未命名')+
            '<div class="m">播放 '+(r.play||0)+'　·　5 秒 '+(r.s5||0)+'%　·　完播 '+(r.fin||0)+'%　·　涨粉 '+(r.fans||0)+'</div>'+
            '<div class="m" style="color:'+d.c+';font-weight:600">→ '+d.t+'</div>'+
          '</div>'+
          '<button class="btn sm ghost" data-del="'+r.rid+'">删</button>'+
        '</div>';
      }).join('') : '<div class="hint">暂无记录。</div>')+
    '</div>';

  $('#btnAdd').onclick = function(){
    var r = {
      rid: Date.now(),
      date: todayKey(),
      title: $('#fTitle').value.trim(),
      play: $('#fPlay').value,
      s5: $('#fS5').value,
      fin: $('#fFin').value,
      fans: $('#fFans').value || 0,
      cmt: $('#fCmt').value || 0
    };
    if(!r.title){ alert('先写一下这条叫什么'); return; }
    state.records.push(r);
    save();
    renderData(b);
  };
  b.querySelectorAll('[data-del]').forEach(function(el){
    el.onclick = function(){
      var rid = +el.getAttribute('data-del');
      state.records = state.records.filter(function(x){ return x.rid !== rid; });
      save();
      renderData(b);
    };
  });
}

/* ============================================================
   发布排期
============================================================ */
function renderPlan(b){
  var days = [];
  for(var i=0;i<7;i++){
    var d = new Date(); d.setDate(d.getDate()+i);
    days.push({key:d.toISOString().slice(0,10), label:(i===0?'今天 · ':'') + (d.getMonth()+1)+'/'+d.getDate()+' '+'日一二三四五六'[d.getDay()]});
  }
  var preset = {};
  if(days[0]) preset[days[0].key] = 'A 版 · 场景故事流（晚 8:00 首发）';
  if(days[2]) preset[days[2].key] = 'B 版 · 干货清单流';
  if(days[4]) preset[days[4].key] = 'C 版 · 数据自查流（有数据后再发）';

  b.innerHTML =
    '<div class="panel">'+
      '<h4>这一周</h4>'+
      '<div class="hint">别把 A 和 B 排在同一天——同一天发等于自己跟自己抢流量。点方框直接改。</div>'+
      '<div style="margin-top:14px">'+
        days.map(function(d){
          var v = state.schedule[d.key] || preset[d.key] || '';
          return '<div class="row"><div class="t" style="flex:0 0 92px;color:#6B7C77;font-size:12.5px">'+d.label+'</div>'+
            '<input data-day="'+d.key+'" value="'+(v||'')+'" placeholder="这天发什么？" '+
            'style="flex:1;border:1.5px solid #E6EFEA;border-radius:12px;padding:9px 11px;font-size:13px;font-family:inherit;background:#FCFEFD">'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<div class="panel">'+
      '<h4>追剧式排期（按单元走）</h4>'+
      '<div class="hint">每条结尾勾下一条，观众才会追着看。同一单元连着发，别跳。</div>'+
      '<div style="margin-top:10px">'+
        ['起步四连','起号常见死法','账号标签与流量','AI 降门槛','变现与闭环','心法与底层'].map(function(u,i){
          var n = state.topics.filter(function(t){ return t.unit===u; }).length;
          return '<div class="row"><div class="t">第 '+(i+1)+' 单元 · '+u+'<div class="m">'+n+' 条</div></div></div>';
        }).join('')+
      '</div>'+
    '</div>';

  b.querySelectorAll('[data-day]').forEach(function(el){
    el.onchange = function(){
      var k = el.getAttribute('data-day');
      if(el.value.trim()) state.schedule[k] = el.value.trim();
      else delete state.schedule[k];
      save();
    };
  });
}

/* ============================================================
   定位与铁律
============================================================ */
function renderRule(b){
  b.innerHTML =
    '<div class="panel"><h4>账号档案</h4><div class="hint">每次拍之前扫一眼，尤其是禁词和隐私两条。</div></div>'+
    RULES.map(function(r){
      return '<div class="panel" style="padding:16px 18px"><div class="row" style="border:0;padding:0">'+
        '<div class="t"><b style="font-size:13.5px">'+r[0]+'</b><div class="m" style="font-size:13px;color:#2E3D39;line-height:1.75;margin-top:5px">'+r[1]+'</div></div>'+
      '</div></div>';
    }).join('')+
    '<div class="panel" style="background:#FFF4DB;border-color:#FFE1B8">'+
      '<h4>发之前最后一遍</h4>'+
      '<div class="hint">① 第一句里有没有"我"字打头？有就换② 有没有出现"教/老师"？③ 有没有提到自己的家庭、负债、学历？④ 结尾有没有勾下一条？</div>'+
    '</div>';
}

/* ============================================================
   导入导出
============================================================ */
$('#btnExport').onclick = function(){
  var blob = new Blob([JSON.stringify(state,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '苏小七工作台备份-' + todayKey() + '.json';
  a.click();
};
$('#btnImport').onclick = function(){ $('#fileImport').click(); };
$('#fileImport').onchange = function(e){
  var f = e.target.files[0]; if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(fr.result);
      if(!d.topics) throw new Error('格式不对');
      state = d; save(); renderHome();
      alert('导入成功');
    }catch(err){ alert('这个文件读不出来，确认是从本工作台导出的备份'); }
  };
  fr.readAsText(f);
};

/* ============================================================
   启动
============================================================ */
init();
renderHome();
</script>
</body>
</html>
