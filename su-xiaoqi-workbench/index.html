<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苏小七 · 自媒体工作台</title>
<style>
:root{
  --mint:#5BC8A8; --mint-d:#3FA98B; --mint-l:#E9F8F2;
  --cream:#FFFDF6; --yellow:#FFC96B; --yellow-l:#FFF4DB;
  --coral:#FF8A7A; --coral-l:#FFEDE9;
  --sky:#7EC8E3; --sky-l:#E8F6FB;
  --lilac:#BFB3F0; --lilac-l:#F1EEFC;
  --ink:#2E3D39; --ink2:#5F716C; --ink3:#85968F;
  --line:#E6EFEA; --card:#FFFFFF;
  --side:#33423D; --side2:#2A3733;
  --shadow:0 10px 24px rgba(91,200,168,.10), 0 2px 6px rgba(46,61,57,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  color:var(--ink);
  background:
    radial-gradient(900px 500px at 6% -10%, #E9F8F2 0%, rgba(233,248,242,0) 62%),
    radial-gradient(760px 440px at 100% 0%, #FFF4DB 0%, rgba(255,244,219,0) 58%),
    #FBFDFB;
  min-height:100vh; -webkit-font-smoothing:antialiased;
}
::selection{background:var(--mint-l)}

/* ================= 布局 ================= */
.app{display:flex;align-items:flex-start;min-height:100vh}

/* ================= 左栏 ================= */
.side{
  width:266px;flex:0 0 266px;height:100vh;position:sticky;top:0;overflow-y:auto;
  background:linear-gradient(168deg,#3B4F49 0%,var(--side) 45%,var(--side2) 100%);
  color:#E6F2EC;padding:22px 14px 26px;border-radius:0 30px 30px 0;
  box-shadow:8px 0 26px rgba(46,61,57,.10)
}
.side::-webkit-scrollbar{width:6px}
.side::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:9px}
.who{display:flex;align-items:center;gap:11px;padding:0 6px 4px}
.who .ava{
  width:46px;height:46px;border-radius:16px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(140deg,#B8EBDC,#5BC8A8);color:#0F3A30;font-weight:800;font-size:19px;
  box-shadow:0 8px 18px rgba(91,200,168,.32);transform:rotate(-5deg)
}
.who h1{margin:0;font-size:15.5px;letter-spacing:.4px;color:#fff}
.who p{margin:3px 0 0;font-size:10.5px;color:#93AEA6;letter-spacing:.6px}
.grp{font-size:10.5px;color:#89A39B;letter-spacing:2px;margin:20px 0 8px;padding-left:12px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;
  font-size:13.5px;color:#D5E5DE;cursor:pointer;transition:.16s;margin-bottom:2px;text-decoration:none
}
.nav a svg{flex:0 0 auto;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff;transform:translateX(2px)}
.nav a.on{
  background:linear-gradient(100deg,#6FD3B5,#48B79A);color:#0E332A;font-weight:700;
  box-shadow:0 8px 18px rgba(91,200,168,.26)
}
.nav a.on svg{opacity:1}
.nav em{font-style:normal;margin-left:auto;font-size:10.5px;background:rgba(255,255,255,.14);padding:1px 7px;border-radius:9px;color:#CFE6DE}
.nav a.on em{background:rgba(14,51,42,.16);color:#0E332A}
.side-foot{margin-top:22px;padding:0 4px;display:flex;gap:8px;flex-wrap:wrap}
.side-foot button{
  flex:1;min-width:96px;border:1.5px dashed rgba(255,255,255,.22);background:rgba(255,255,255,.05);
  color:#CFE2DB;font-size:12px;padding:9px 8px;border-radius:13px;cursor:pointer;font-family:inherit;transition:.16s
}
.side-foot button:hover{border-color:var(--mint);color:#fff;background:rgba(91,200,168,.16)}

/* ================= 主区 ================= */
.main{flex:1;min-width:0;padding:26px 30px 80px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.phead h2{margin:0;font-size:22px;display:flex;align-items:center;gap:10px}
.phead h2::before{content:"";width:5px;height:22px;border-radius:4px;background:linear-gradient(180deg,#B8EBDC,#5BC8A8);display:inline-block}
.phead .sub{margin:4px 0 0;font-size:12.5px;color:var(--ink2);padding-left:15px}
.search{
  display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);
  border-radius:14px;padding:9px 13px;min-width:210px
}
.search input{border:0;outline:0;font-size:13px;font-family:inherit;width:100%;color:var(--ink);background:transparent}
.search input::placeholder{color:var(--ink3)}

/* ================= 通用 ================= */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:1180px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:680px){.grid{grid-template-columns:1fr}}
.tile{
  text-align:left;background:var(--card);border:2px solid var(--line);border-radius:24px;padding:18px 18px 16px;
  cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;font-family:inherit;
  box-shadow:0 4px 14px rgba(46,61,57,.04);position:relative;overflow:hidden;display:block;width:100%
}
.tile:hover{transform:translateY(-4px) rotate(-.4deg);border-color:var(--mint);box-shadow:0 16px 26px rgba(91,200,168,.18)}
.tile .ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;margin-bottom:12px;transform:rotate(-5deg)}
.tile h3{margin:0 0 5px;font-size:14.5px}
.tile .sub2{font-size:11.5px;color:#7C8D87}
.tile .num{font-size:11px;color:var(--mint-d);background:var(--mint-l);border-radius:999px;padding:2px 9px;position:absolute;right:14px;top:14px}
.i-y{background:var(--yellow-l)} .i-m{background:var(--mint-l)} .i-s{background:var(--sky-l)}
.i-c{background:var(--coral-l)} .i-l{background:var(--lilac-l)} .i-g{background:#EAF6EE}

.panel{background:#fff;border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h4{margin:0 0 12px;font-size:14px;display:flex;align-items:center;gap:8px}
.panel h4 .dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}
.hint{font-size:12.5px;color:#7E8F89;line-height:1.75}
.hint b{color:var(--mint-d)}
.row{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row .t{flex:1;font-size:13.5px;line-height:1.55;min-width:0}
.row .m{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.6}
.btn{
  border:0;background:var(--mint);color:#fff;border-radius:14px;padding:11px 18px;font-size:13px;
  cursor:pointer;font-family:inherit;font-weight:600;transition:.18s;box-shadow:0 6px 14px rgba(91,200,168,.26)
}
.btn:hover{background:var(--mint-d);transform:translateY(-1px)}
.btn.ghost{background:#fff;color:var(--ink2);border:2px solid var(--line);box-shadow:none}
.btn.ghost:hover{color:var(--mint-d);border-color:var(--mint)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:11px}
.btn.xs{padding:5px 10px;font-size:11.5px;border-radius:10px;box-shadow:none}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{
  border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;
  color:var(--ink2);cursor:pointer;font-family:inherit;transition:.15s
}
.chip.on{background:var(--mint);border-color:var(--mint);color:#fff;font-weight:600}
.pill{font-size:11px;border-radius:999px;padding:3px 10px;cursor:pointer;user-select:none;border:1px solid transparent;white-space:nowrap}
.p0{background:#F2F5F3;color:var(--ink2)} .p1{background:var(--yellow-l);color:#9A6B00}
.p2{background:var(--sky-l);color:#2A7E9C} .p3{background:var(--coral-l);color:#B14E3E}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px;margin-bottom:12px}
.form label{font-size:11.5px;color:var(--ink2);display:block;margin-bottom:5px}
.form input,.form select,.form textarea,.inline{
  width:100%;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;font-size:13px;
  font-family:inherit;color:var(--ink);background:#FCFEFD;outline:none
}
.form textarea{min-height:70px;resize:vertical;line-height:1.7}
.form input:focus,.form select:focus,.form textarea:focus,.inline:focus{border-color:var(--mint);background:#fff}
.wide{grid-column:1/-1}
.hidden{display:none!important}
.empty{font-size:12.5px;color:var(--ink3);padding:10px 0}

/* ================= 首页 ================= */
.hero{
  background:linear-gradient(120deg,#FFFFFF 0%,#FFFDF6 100%);border:2px solid var(--line);border-radius:26px;
  padding:20px 22px;margin-bottom:18px;box-shadow:var(--shadow);position:relative;overflow:hidden
}
.hero:before{content:"";position:absolute;right:-46px;top:-46px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#FFF4DB,rgba(255,244,219,0) 70%)}
.hero h3{margin:0 0 6px;font-size:16px}
.hero p{margin:0;font-size:13px;color:var(--ink2);line-height:1.75}
.hero b{color:var(--mint-d)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px 16px;box-shadow:0 4px 12px rgba(46,61,57,.04)}
.kpi .n{font-size:22px;font-weight:800;color:var(--mint-d);letter-spacing:.5px}
.kpi .l{font-size:11.5px;color:var(--ink3);margin-top:4px}
.todo{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.todo:last-child{border-bottom:0}
.box{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);flex:0 0 auto;display:grid;place-items:center;transition:.15s}
.todo.done .box{background:var(--mint);border-color:var(--mint)}
.todo.done .box:after{content:"";width:6px;height:10px;border-right:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(45deg) translateY(-1px)}
.todo.done span{color:var(--ink3);text-decoration:line-through}
.progress{height:9px;border-radius:999px;background:#EFF5F1;overflow:hidden;margin:8px 0 12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,#B8EBDC,#5BC8A8);border-radius:999px;transition:width .35s}

/* ================= 脚本 ================= */
.script{border:2px solid var(--line);border-radius:20px;padding:16px 18px;margin-bottom:12px;background:#fff}
.script .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:11px;border-radius:999px;padding:3px 10px;background:var(--mint-l);color:var(--mint-d)}
.script h5{margin:8px 0 4px;font-size:14.5px}
.script p{margin:4px 0 0;font-size:12.5px;color:var(--ink2);line-height:1.6}
.script .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.script .full{margin-top:12px;font-size:13px;line-height:1.9}

/* ================= 提词器 ================= */
.prompter{position:fixed;inset:0;background:#111A18;color:#F3F7F4;display:none;z-index:90;overflow-y:auto;padding:40px 24px 130px}
.prompter.on{display:block}
.ptxt{max-width:720px;margin:0 auto;font-size:30px;line-height:2;letter-spacing:.6px;font-weight:500}
.prompter .pbar{position:fixed;right:20px;bottom:24px;display:flex;gap:8px;background:rgba(255,255,255,.10);border-radius:16px;padding:8px;backdrop-filter:blur(6px)}
.prompter .pbar button{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:11px;padding:9px 13px;font-size:13px;cursor:pointer;font-family:inherit}
.prompter .pbar button:hover{background:rgba(255,255,255,.26)}

/* ================= 图表 ================= */
.chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding:8px 4px 0;border-bottom:2px solid var(--line)}
.barwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar{width:100%;max-width:44px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#B8EBDC,#5BC8A8);min-height:3px;transition:.3s}
.bar.b2{background:linear-gradient(180deg,#FFE1B8,#FFC96B)}
.barlab{font-size:10.5px;color:var(--ink3);text-align:center;line-height:1.3}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--ink2);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}

/* ================= 注意力预算 ================= */
.budget-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px dashed var(--line)}
.budget-row .nm{flex:0 0 108px;font-size:13px}
.budget-row .track{flex:1;height:12px;border-radius:999px;background:#F1F6F3;overflow:hidden}
.budget-row .track i{display:block;height:100%;border-radius:999px}
.budget-row .mn{flex:0 0 92px;display:flex;align-items:center;gap:6px;justify-content:flex-end}
.budget-row .mn button{width:24px;height:24px;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;font-size:13px;line-height:1;font-family:inherit}
.budget-row .mn input{width:44px;text-align:center;border:1.5px solid var(--line);border-radius:9px;padding:4px 2px;font-size:12.5px;font-family:inherit}

@media (max-width:920px){
  .app{display:block}
  .side{width:auto;flex:none;height:auto;position:static;border-radius:0 0 28px 28px;padding:18px 14px 16px}
  .grp{display:none}
  .nav{display:flex;overflow-x:auto;gap:6px;padding-bottom:4px}
  .nav a{white-space:nowrap;background:rgba(255,255,255,.06);margin-bottom:0}
  .nav a em{display:none}
  .main{padding:18px 14px 60px}
  .ptxt{font-size:24px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ 左栏 ============ -->
  <aside class="side">
    <div class="who">
      <div class="ava">七</div>
      <div>
        <h1>苏小七</h1>
        <p>CONTENT CREATOR WORKBENCH</p>
      </div>
    </div>

    <div class="navwrap">
      <div class="grp">总览</div>
      <nav class="nav">
        <a data-page="home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>首页</a>
      </nav>

      <div class="grp">内容</div>
      <nav class="nav">
        <a data-page="hot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 5 6 5 9a5 5 0 01-10 0c0-1 .5-2 1-3"/><path d="M12 21a3 3 0 01-3-3c0-2 3-4 3-4s3 2 3 4a3 3 0 01-3 3z"/></svg>盯热点<em id="nHot">0</em></a>
        <a data-page="tear"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>拆爆款<em id="nTear">0</em></a>
        <a data-page="topics"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3 11v2h6v-2a6 6 0 00-3-11z"/></svg>建选题库<em id="nTopic">0</em></a>
        <a data-page="script"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l5 5v13a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1zM14 3v5h5"/></svg>脚本创作<em id="nScript">0</em></a>
        <a data-page="mats"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 012-2h9l5 5v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/><path d="M9 12h6M9 16h4"/></svg>管资料<em id="nMat">0</em></a>
      </nav>

      <div class="grp">运营</div>
      <nav class="nav">
        <a data-page="review"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>做复盘<em id="nRec">0</em></a>
        <a data-page="insight"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 3 4-6 5 4"/><path d="M3 21h18"/></svg>洞察复盘</a>
        <a data-page="plan"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v3M17 3v3M4 8h16M5 5h14a1 1 0 011 1v13a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1z"/></svg>发布排期</a>
        <a data-page="focus"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>注意力预算</a>
      </nav>

      <div class="grp">底盘</div>
      <nav class="nav">
        <a data-page="rule"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v6c0 4-3 7-8 8-5-1-8-4-8-8V7l8-4z"/><path d="M9 12l2 2 4-4"/></svg>定位与铁律</a>
      </nav>
    </div>

    <div class="side-foot">
      <button id="btnExport">导出备份</button>
      <button id="btnImport">导入备份</button>
      <input type="file" id="fileImport" accept=".json" class="hidden">
    </div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main">
    <div class="phead">
      <div>
        <h2 id="pTitle">首页</h2>
        <p class="sub" id="pSub"></p>
      </div>
      <label class="search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9AAAA5" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <input id="q" placeholder="搜选题 / 金句 / 素材">
      </label>
    </div>
    <div id="pageBody"></div>
  </main>
</div>

<!-- ============ 提词器 ============ -->
<div class="prompter" id="prompter">
  <div class="ptxt" id="ptxt"></div>
  <div class="pbar">
    <button id="ptMinus">A－</button>
    <button id="ptPlus">A＋</button>
    <button id="ptAuto">自动滚动</button>
    <button id="ptExit">退出</button>
  </div>
</div>

<script>
/* ============================================================
   基础
============================================================ */
var $ = function(s){ return document.querySelector(s); };
var KEY = 'suXiaoQi_workbench_v2';
var OLDKEY = 'suXiaoQi_workbench_v1';
var S = null;
function pad(n){ return n<10 ? '0'+n : ''+n; }
function todayKey(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function todayCN(){
  var d=new Date();
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+'周'+'日一二三四五六'[d.getDay()];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ console.warn('保存失败',e); } }

/* ============================================================
   种子数据
============================================================ */
var SEED_TOPICS = [
  {id:1,  unit:'起步四连', title:'删了第 8 条口播，前 7 条全栽在同一个坑里', logic:'开头不是表达，是交付', pit:'报户口式开头＝赶人', status:'待拍'},
  {id:2,  unit:'起步四连', title:'你不是没定位，你是拍太少——定位是拍出来的', logic:'反馈大于脑子', pit:'坐那想三天，不如先拍三条', status:'待拍'},

/* ============================================================
   初始化 / 迁移
============================================================ */
function init(){
  var raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(raw){ try{ S = JSON.parse(raw); }catch(e){ S = null; } }

  if(!S){
    var old = null;
    try{ old = localStorage.getItem(OLDKEY); }catch(e){}
    S = {
      topics: SEED_TOPICS.map(function(x){ return Object.assign({},x); }),
      records: [],
      todos: {},
      schedule: {},
      hot: SEED_HOT.map(function(x){ return Object.assign({},x); }),
      tear: SEED_TEAR.map(function(x){ return Object.assign({},x); }),
      mats: SEED_MATS.map(function(x){ return Object.assign({},x); }),
      budget: {},
      startedAt: todayKey()
    };
    if(old){
      try{
        var o = JSON.parse(old);
        if(o.topics && o.topics.length) S.topics = o.topics;
        if(o.records) S.records = o.records;
        if(o.todos) S.todos = o.todos;
        if(o.schedule) S.schedule = o.schedule;
      }catch(e){}
    }
    save();
  }
  ['topics','records','hot','tear','mats','todos','schedule','budget'].forEach(function(k){
    if(!S[k]) S[k] = (k==='todos'||k==='schedule'||k==='budget') ? {} : [];
  });
  if(!S.recoTaken) S.recoTaken = [];
  if(!S.budget[todayKey()]){
    S.budget[todayKey()] = DEFAULT_BUDGET.map(function(b){ return {k:b.k, v:b.v}; });
    save();
  }
}

/* ============================================================

============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function todoState(){ var k=todayKey(); if(!S.todos[k]) S.todos[k]={}; return S.todos[k]; }
function todoDone(){ var s=todoState(), n=0; for(var i=0;i<TODO_ITEMS.length;i++){ if(s[i]) n++; } return n; }
function avg(arr, key){ if(!arr.length) return 0; var t=0,c=0; arr.forEach(function(r){ var v=parseFloat(r[key]); if(!isNaN(v)){ t+=v; c++; } }); return c? Math.round(t/c*10)/10 : 0; }
function diag(r){
  if(r.s5===''||r.s5==null||isNaN(parseFloat(r.s5))) return {t:'还没填 5 秒完播率', c:'#6B7C77'};
  if(parseFloat(r.s5)<25) return {t:'开头还在赶人：改头五个字，别改选题', c:'#B14E3E'};
  if(r.fin!==''&&parseFloat(r.fin)<10) return {t:'中段太拖：把中间砍掉三分之一', c:'#9A6B00'};
  if(parseFloat(r.fans||0)===0) return {t:'内容行、承接不行：先补主页简介和三置顶', c:'#2A7E9C'};
  return {t:'结构没问题：保持这个开头方式', c:'#3FA98B'};
}

function pageTopics(b){
  var statuses = ['全部','待拍','已拍','已发','爆了'];

  b.innerHTML =
    '<div class="panel">'+
      '<h4><span class="dot"></span>按状态筛</h4>'+
      '<div class="chips">'+statuses.map(function(s){
        return '<button class="chip'+(topicFilter===s?' on':'')+'" data-f="'+s+'">'+s+'</button>';
      }).join('')+'</div>'+
      '<div class="hint">共 '+list.length+' 条　·　点右边标签切换：待拍 → 已拍 → 已发 → 爆了</div>'+
    '</div>'+
    '<div class="panel">'+
      '<h4><span class="dot"></span>加一条自己的</h4>'+
      '<div class="form">'+
        '<div class="wide"><label>标题（说人话，一句话）</label><input id="nTitle" placeholder="你不是…你是…"></div>'+
        '<div><label>所属单元</label><select id="nUnit">'+units.filter(function(u){return u!=='全部';}).map(function(u){ return '<option>'+esc(u)+'</option>'; }).join('')+'</select></div>'+
        '<div><label>逻辑</label><input id="nLogic" placeholder="凭什么成立"></div>'+
        '<div><label>避坑点</label><input id="nPit" placeholder="别人踩什么坑"></div>'+
      '</div>'+
      '<button class="btn" id="nAdd">加进选题库</button>'+
    '</div>'+
    '<div class="panel">'+
      list.map(function(t){
        var cls = {'待拍':'p0','已拍':'p1','已发':'p2','爆了':'p3'}[t.status] || 'p0';
        return '<div class="row">'+
          '<div class="t">'+t.id+'. '+esc(t.title)+
            '<div class="m">'+esc(t.unit)+'　·　逻辑：'+esc(t.logic)+'　·　避坑点：'+esc(t.pit)+'</div>'+
          '</div>'+
          '<span class="pill '+cls+'" data-id="'+t.id+'">'+t.status+'</span>'+
        '</div>';
      }).join('')+
    '</div>';

    el.onclick = function(){ topicFilter = el.getAttribute('data-f'); pageTopics(b); };
  });
  b.querySelectorAll('[data-id]').forEach(function(el){
    el.onclick = function(){
      var id = +el.getAttribute('data-id'), order = ['待拍','已拍','已发','爆了'];
      var t = S.topics.filter(function(x){ return x.id===id; })[0];
      t.status = order[(order.indexOf(t.status)+1)%order.length];
      save(); badges(); pageTopics(b);
    };
  });
  $('#nAdd').onclick = function(){
    var title = $('#nTitle').value.trim();
    if(!title){ alert('先写标题'); return; }
    var maxId = 0;
    S.topics.forEach(function(t){ if(t.id>maxId) maxId = t.id; });
    S.topics.push({id:maxId+1, unit:$('#nUnit').value, title:title, logic:$('#nLogic').value.trim()||'—', pit:$('#nPit').value.trim()||'—', status:'待拍'});
    save(); badges(); pageTopics(b);
  };
}

var ptFont = 30, ptTimer = null;
function openPrompter(ver){
  var s = SCRIPTS.filter(function(x){ return x.ver===ver; })[0];
  $('#ptxt').innerHTML = s.body.map(function(l){ return l==='' ? '<div style="height:18px"></div>' : '<p style="margin:0 0 2px">'+esc(l)+'</p>'; }).join('');

  $('#ptxt').style.fontSize = ptFont+'px';
  $('#prompter').scrollTop = 0;
}
$('#ptExit').onclick = function(){
  $('#prompter').classList.remove('on');
  if(ptTimer){ clearInterval(ptTimer); ptTimer=null; $('#ptAuto').textContent='自动滚动'; }
};
$('#ptPlus').onclick = function(){ ptFont = Math.min(56,ptFont+3); $('#ptxt').style.fontSize = ptFont+'px'; };
$('#ptMinus').onclick = function(){ ptFont = Math.max(18,ptFont-3); $('#ptxt').style.fontSize = ptFont+'px'; };
$('#ptAuto').onclick = function(){
  if(ptTimer){ clearInterval(ptTimer); ptTimer=null; this.textContent='自动滚动'; }
  else{ this.textContent='暂停'; ptTimer = setInterval(function(){ $('#prompter').scrollTop += 1; }, 60); }
};

/* ============================================================
   洞察复盘
============================================================ */
function pageInsight(b){
  var rs = S.records;
  var posted = S.topics.filter(function(x){ return x.status==='已发'||x.status==='爆了'; }).length;
  var best = null;
  rs.forEach(function(r){ if(!best || (parseFloat(r.s5)||0) > (parseFloat(best.s5)||0)) best = r; });
  var aS5 = avg(rs,'s5'), aFin = avg(rs,'fin');
  var fans = 0; rs.forEach(function(r){ fans += parseFloat(r.fans)||0; });
  var plays = 0; rs.forEach(function(r){ plays += parseFloat(r.play)||0; });

  var concl;
  if(!rs.length) concl = '还没有数据。发第一条、48 小时后回来记一次，这里就会开始说话。';
  else if(aS5 < 25) concl = '平均 5 秒完播 '+aS5+'%，还在 25% 以下 —— 说明开头还在赶人。下一步只改开头那五个字，先别换选题、别换风格。';
  else if(aFin < 10) concl = '5 秒完播 '+aS5+'% 还行，但完播只有 '+aFin+'% —— 开头留住了，中段把人放跑了。砍掉中间三分之一再发一条。';
  else if(fans === 0) concl = '完播数据能看，但没涨粉 —— 内容没问题，衔接有问题。先把主页简介和三条置顶补上，再发下一条。';
  else concl = '数据是通的：平均 5 秒完播 '+aS5+'%、完播 '+aFin+'%、累计涨粉 '+fans+'。保持这个开头方式，往选题深度走。';

  b.innerHTML =
    '<div class="kpis">'+
      '<div class="kpi"><div class="n">'+rs.length+'</div><div class="l">记录条数</div></div>'+
      '<div class="kpi"><div class="n">'+posted+'</div><div class="l">选题已发</div></div>'+
      '<div class="kpi"><div class="n">'+(aS5||'—')+'</div><div class="l">平均 5 秒完播 %</div></div>'+
      '<div class="kpi"><div class="n">'+(aFin||'—')+'</div><div class="l">平均完播 %</div></div>'+
      '<div class="kpi"><div class="n">'+plays+'</div><div class="l">累计播放</div></div>'+
      '<div class="kpi"><div class="n">'+fans+'</div><div class="l">累计涨粉</div></div>'+
    '</div>'+
    '<div class="panel" style="background:linear-gradient(120deg,#FFFDF6,#E9F8F2);border-color:#CFEDE3">'+
      '<h4><span class="dot"></span>这一句结论</h4>'+
      '<div class="hint" style="font-size:13.5px;color:#2E3D39;line-height:1.85">'+concl+'</div>'+
    '</div>'+
    '<div class="panel">'+
      '<h4><span class="dot"></span>表现最好的一条</h4>'+
      (best ? '<div class="row"><div class="t">'+esc(best.title||'未命名')+
        '<div class="m">5 秒 '+esc(best.s5||0)+'%　·　完播 '+esc(best.fin||0)+'%　·　播放 '+esc(best.play||0)+'　·　涨粉 '+esc(best.fans||0)+'</div></div></div>'
        : '<div class="empty">还没有数据。</div>')+
    '</div>'+
    '<div class="panel">'+
      '<h4><span class="dot"></span>下一步三件事</h4>'+
      '<div class="hint">'+
        '① 数据最差的那条，只看开头，重录一遍同样的内容<br>'+
        '② 表现最好的那条，换个场景/人群再拍一版（换血不换骨）<br>'+
        '③ 一次只动一个变量，改完发一条再看数'+
      '</div>'+
    '</div>';
}

function pagePlan(b){
  var days = [];
  for(var i=0;i<7;i++){
    var d = new Date(); d.setDate(d.getDate()+i);
    days.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()), label:(i===0?'今天 · ':'')+(d.getMonth()+1)+'/'+d.getDate()+' 周'+'日一二三四五六'[d.getDay()]});
  }
  var preset = {};
  preset[days[0].key] = 'A 版 · 场景故事流';
  preset[days[2].key] = 'B 版 · 干货清单流';
  preset[days[4].key] = 'C 版 · 数据自查流（有数据后再发）';

  b.innerHTML =
    '<div class="panel">'+
      '<h4><span class="dot"></span>这一周</h4>'+
      '<div class="hint">别把 A 和 B 排在同一天 —— 同一天发等于自己跟自己抢流量。直接改框里的字。</div>'+
      '<div style="margin-top:12px">'+
        days.map(function(d){
          var v = S.schedule[d.key] || preset[d.key] || '';
          return '<div class="row"><div class="t" style="flex:0 0 92px;color:#6B7C77;font-size:12.5px">'+d.label+'</div>'+
            '<input class="inline" data-day="'+d.key+'" value="'+esc(v)+'" placeholder="这天发什么？"></div>';
        }).join('')+
      '</div>'+
    '</div>'+
    '<div class="panel">'+
      '<h4><span class="dot"></span>追剧式排期（按单元走）</h4>'+
      '<div class="hint">每条结尾勾下一条，观众才会追着看。同一单元连着发，别跳。</div>'+
      '<div style="margin-top:10px">'+
        ['起步四连','起号常见死法','账号标签与流量','AI 降门槛','变现与闭环','心法与底层'].map(function(u,i){
          var n = S.topics.filter(function(t){ return t.unit===u; }).length;
          var doneN = S.topics.filter(function(t){ return t.unit===u && (t.status==='已发'||t.status==='爆了'); }).length;
          return '<div class="row"><div class="t">第 '+(i+1)+' 单元 · '+esc(u)+
            '<div class="m">'+n+' 条　·　已发 '+doneN+'</div></div>'+
            '<div style="flex:0 0 80px"><div class="progress" style="margin:0"><i style="width:'+Math.round(doneN/n*100)+'%"></i></div></div>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>';

  b.querySelectorAll('[data-day]').forEach(function(el){
    el.onchange = function(){
      var k = el.getAttribute('data-day');
      if(el.value.trim()) S.schedule[k] = el.value.trim(); else delete S.schedule[k];
      save();
    };
  });
}

/* ============================================================
   注意力预算
============================================================ */
function pageFocus(b){
  var cur = S.budget[todayKey()] || DEFAULT_BUDGET.map(function(x){ return {k:x.k,v:x.v}; });
  var total = 0; cur.forEach(function(x){ total += (+x.v||0); });
  var max = Math.max(total, 60);
  var limit = 150;
  var colorOf = function(k){
    var f = DEFAULT_BUDGET.filter(function(x){ return x.k===k; })[0];
    return f ? f.c : '#5BC8A8';
  };

  b.innerHTML =
    '<div class="panel">'+
      '<h4><span class="dot"></span>今天的时间怎么用</h4>'+
      '<div class="hint">默认按 <b>2.5 小时</b> 排。改数字就行，下面会算总账。</div>'+
      '<div style="margin-top:14px">'+
        cur.map(function(x,i){
          var w = Math.round((+x.v||0)/max*100);
          return '<div class="budget-row">'+
            '<div class="nm">'+esc(x.k)+'</div>'+
            '<div class="track"><i style="width:'+w+'%;background:'+colorOf(x.k)+'"></i></div>'+
            '<div class="mn">'+
              '<button data-m="'+i+'" data-d="-5">−</button>'+
              '<input data-v="'+i+'" type="number" value="'+(+x.v||0)+'">'+
              '<button data-m="'+i+'" data-d="5">＋</button>'+
            '</div>'+
          '</div>';
        }).join('')+
      '</div>'+
      '<div class="row" style="border:0;padding-top:14px">'+
        '<div class="t"><b>合计 '+(total/60).toFixed(1)+' 小时（'+total+' 分钟）</b>'+
        '<div class="m">'+(total>limit ? '比 2.5 小时多出 '+(total-limit)+' 分钟 —— 排太满，第一天就会断' : '还有 '+(limit-total)+' 分钟缓冲，够处理杂事')+'</div></div>'+
      '</div>'+
    '</div>'+
    '<div class="panel">'+
      '<h4><span class="dot"></span>三条规矩</h4>'+
      '<div class="hint">① 录制那块别超过 40 分钟 —— 越录越挑，最后一条都发不出去<br>'+
      '② 剪辑和上字幕是最容易被 AI 接管的一块<br>'+
      '③ 互动回复排进预算里，它决定你评论区能不能长起来</div>'+
    '</div>';

  b.querySelectorAll('[data-m]').forEach(function(el){
    el.onclick = function(){
      var i = +el.getAttribute('data-m'), d = +el.getAttribute('data-d');
      var arr = S.budget[todayKey()];
      arr[i].v = Math.max(0, (+arr[i].v||0) + d);
      save(); pageFocus(b);
    };
  });
  b.querySelectorAll('[data-v]').forEach(function(el){
    el.onchange = function(){
      var i = +el.getAttribute('data-v');
      S.budget[todayKey()][i].v = Math.max(0, parseInt(el.value,10)||0);
      save(); pageFocus(b);
    };
  });
}

/* ============================================================
   定位与铁律
============================================================ */
function pageRule(b){
  b.innerHTML =
    '<div class="panel"><h4><span class="dot"></span>账号档案</h4><div class="hint">每次拍之前扫一眼，尤其是禁词和隐私两条。</div></div>'+
    RULES.map(function(r){
      return '<div class="panel" style="padding:16px 18px;margin-bottom:10px">'+
        '<div style="font-size:13.5px;font-weight:700">'+esc(r[0])+'</div>'+
        '<div style="font-size:13px;color:#2E3D39;line-height:1.8;margin-top:5px">'+esc(r[1])+'</div>'+
      '</div>';
    }).join('')+
    '<div class="panel" style="background:#FFF4DB;border-color:#FFE1B8">'+
      '<h4><span class="dot"></span>发之前最后一遍</h4>'+
      '<div class="hint">① 第一句里有没有"我"字打头？有就换<br>② 有没有出现"教 / 老师"？<br>③ 有没有提到家庭、负债、学历？<br>④ 结尾有没有勾下一条？</div>'+
    '</div>';
}

/* ============================================================
   搜索
============================================================ */
function pageSearch(b){
  var q = searchQ.trim().toLowerCase();
  if(!q){ b.innerHTML = '<div class="panel"><div class="empty">输入关键词试试，比如"报户口"、"开头"、"闲鱼"。</div></div>'; return; }
  var hitTopics = S.topics.filter(function(t){ return (t.title+t.logic+t.pit+t.unit).toLowerCase().indexOf(q)>=0; });
  var hitMats   = S.mats.filter(function(m){ return (m.text+m.cat).toLowerCase().indexOf(q)>=0; });
  var hitHot    = S.hot.filter(function(h){ return (h.title+(h.why||'')).toLowerCase().indexOf(q)>=0; });
  var hitTear   = S.tear.filter(function(t){ return JSON.stringify(t).toLowerCase().indexOf(q)>=0; });
  var hitScript = SCRIPTS.filter(function(s){ return (s.title+s.body.join('')).toLowerCase().indexOf(q)>=0; });

  function sec(name, arr, fmt){
    if(!arr.length) return '';
    return '<div class="panel"><h4><span class="dot"></span>'+name+'（'+arr.length+'）</h4>'+arr.map(fmt).join('')+'</div>';
  }

  b.innerHTML =
    sec('选题', hitTopics, function(t){ return '<div class="row"><div class="t">'+t.id+'. '+esc(t.title)+'<div class="m">'+esc(t.unit)+'　·　'+esc(t.pit)+'</div></div></div>'; })+
    sec('素材', hitMats, function(m){ return '<div class="row"><div class="t"><span class="pill p2" style="margin-right:8px">'+esc(m.cat)+'</span>'+esc(m.text)+'</div></div>'; })+
    sec('脚本', hitScript, function(s){ return '<div class="row"><div class="t">'+esc(s.ver)+' 版 · '+esc(s.title)+'<div class="m">'+esc(s.name)+'　·　'+esc(s.dur)+'</div></div><button class="btn xs" data-page2script="'+s.ver+'">打开</button></div>'; })+
    sec('热点', hitHot, function(h){ return '<div class="row"><div class="t">'+esc(h.title)+'<div class="m">'+esc(h.platform)+'</div></div></div>'; })+
    sec('拆解卡', hitTear, function(t){ return '<div class="row"><div class="t">'+esc(t.src)+'<div class="m">'+esc(t.reuse||'')+'</div></div></div>'; })+
    (!hitTopics.length && !hitMats.length && !hitHot.length && !hitTear.length && !hitScript.length ?
      '<div class="panel"><div class="empty">没搜到。换个词，或者直接去对应模块里加一条。</div></div>' : '');

  b.querySelectorAll('[data-page2script]').forEach(function(el){
    el.onclick = function(){ go('script'); };
  });
}

/* ============================================================
   导入导出
============================================================ */
$('#btnExport').onclick = function(){
  var blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '苏小七工作台备份-' + todayKey() + '.json';
  a.click();
};
$('#btnImport').onclick = function(){ $('#fileImport').click(); };
$('#fileImport').onchange = function(e){
  var f = e.target.files[0]; if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    try{
      var d = JSON.parse(fr.result);
      if(!d.topics) throw new Error('format');
      S = d; save(); go('home');
      alert('导入成功');
    }catch(err){ alert('这个文件读不出来，确认是从本工作台导出的备份'); }
  };
  fr.readAsText(f);
};

/* ============================================================
   搜索框
============================================================ */
$('#q').oninput = function(){
  searchQ = this.value;
  if(searchQ.trim()){ go('search'); }
  else if(CUR==='search'){ go('home'); }
};

/* ============================================================
   启动
============================================================ */
init();
go('home');
</script>
</body>
</html>
