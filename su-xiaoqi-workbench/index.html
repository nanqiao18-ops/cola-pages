<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>苏小七 · 内容工作台</title>
<style>
:root{
  --bg:#FFFFFF; --bg2:#F5F5F7; --bg3:#FAFAFC;
  --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#86868B;
  --line:#D2D2D7; --line2:#E8E8ED;
  --blue:#0071E3; --blue-d:#0062C4;
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.72; font-size:16px;
}
a{color:var(--blue);text-decoration:none}
.wrap{max-width:1020px;margin:0 auto;padding:0 24px}

/* ---------- top nav ---------- */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.78);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line2)}
.navrow{display:flex;align-items:center;gap:22px;height:54px}
.brand{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--ink);white-space:nowrap;cursor:pointer}
.brand em{color:var(--ink3);font-style:normal;font-weight:400;margin-left:7px;font-size:13px}
.tabs{display:flex;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{font-size:13.5px;color:var(--ink2);padding:7px 13px;border-radius:999px;white-space:nowrap;cursor:pointer;transition:color .2s,background .2s}
.tabs a:hover{color:var(--ink)}
.tabs a.on{background:var(--ink);color:#fff}
.mini{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 15px;font-size:12.5px;color:var(--ink2);cursor:pointer;white-space:nowrap}
.mini:hover{color:var(--ink);border-color:var(--ink3)}

/* ---------- type ---------- */
.kicker{font-size:12.5px;letter-spacing:.12em;color:var(--blue);font-weight:600;margin:0 0 14px}
h1{font-size:clamp(36px,5.4vw,58px);line-height:1.18;letter-spacing:-.028em;font-weight:600;margin:0 0 24px;text-wrap:balance}
h2{font-size:clamp(25px,3.4vw,36px);line-height:1.15;letter-spacing:-.022em;font-weight:600;margin:0 0 16px}
h3{font-size:19px;letter-spacing:-.01em;font-weight:600;margin:0 0 10px}
.lead{font-size:20px;line-height:1.55;color:var(--ink2);max-width:660px;margin:0 0 34px}
.sub{font-size:14.5px;line-height:1.75;color:var(--ink2)}
.tiny{font-size:12.5px;line-height:1.7;color:var(--ink3)}
section{padding:96px 0}
section.tight{padding:48px 0}
.hr{height:1px;background:var(--line2);margin:0}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:999px;padding:11px 24px;font-size:14.5px;font-weight:500;cursor:pointer;font-family:inherit;transition:transform .15s,background .2s}
.btn:active{transform:scale(.98)}
.btn.p{background:var(--blue);color:#fff}
.btn.p:hover{background:var(--blue-d)}
.btn.g{background:var(--bg2);color:var(--ink)}
.btn.g:hover{background:#EDEDF0}
.btn.t{background:transparent;color:var(--blue);padding:8px 0;font-size:14px}
.btn.t:hover{text-decoration:underline}
.btn.sm{padding:7px 15px;font-size:13px}
.link{color:var(--blue);cursor:pointer;font-size:14px}
.link:hover{text-decoration:underline}

/* ---------- cards ---------- */
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--bg2);border-radius:24px;padding:30px 30px 28px}
.card.w{background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.03),0 18px 50px rgba(0,0,0,.045)}
.card h3{margin-bottom:8px}
.card p{margin:0;font-size:14.8px;line-height:1.75;color:var(--ink2)}
.entry{background:#fff;border-radius:24px;padding:32px 32px 30px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.03),0 16px 44px rgba(0,0,0,.04);transition:transform .25s,box-shadow .25s}
.entry:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(0,0,0,.04),0 26px 60px rgba(0,0,0,.075)}
.modgrid{display:flex;flex-wrap:wrap;gap:20px;justify-content:center}
.modgrid>.entry{flex:1 1 290px;max-width:calc(33.333% - 14px)}
.entry .no{font-size:11.5px;color:var(--ink3);letter-spacing:.14em;margin-bottom:18px}
.entry h3{font-size:21px;margin-bottom:8px}
.entry p{margin:0;font-size:14.5px;line-height:1.7;color:var(--ink2)}
.entry .go{margin-top:22px;font-size:13px;color:var(--blue)}

/* ---------- hero ---------- */
.hero{padding:120px 0 84px;text-align:center}
.hero h1{margin-left:auto;margin-right:auto;max-width:820px}
.hero .lead{margin-left:auto;margin-right:auto;text-align:center;max-width:600px}
.hero .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}

/* ---------- quiz ---------- */
.qbox{background:var(--bg2);border-radius:24px;padding:34px}
.qnum{font-size:12.5px;color:var(--ink3);letter-spacing:.1em;margin-bottom:10px}
.qtext{font-size:22px;font-weight:600;letter-spacing:-.015em;margin:0 0 20px;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{background:#fff;border:1px solid var(--line2);border-radius:14px;padding:15px 18px;cursor:pointer;font-size:15px;color:var(--ink);text-align:left;font-family:inherit;transition:border-color .18s,background .18s}
.opt:hover{border-color:var(--ink3)}
.opt.on{border-color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1px var(--ink)}
.bar{height:4px;background:var(--line2);border-radius:4px;overflow:hidden;margin:24px 0 0}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px;transition:width .3s}

/* ---------- form ---------- */
textarea,input[type=text]{width:100%;border:1px solid var(--line2);background:#fff;border-radius:14px;padding:14px 16px;font-size:14.5px;font-family:inherit;color:var(--ink);line-height:1.6;resize:vertical}
textarea:focus,input[type=text]:focus{outline:none;border-color:var(--ink3)}
textarea{min-height:150px}
label.f{display:block;font-size:13px;color:var(--ink2);margin:0 0 7px}
.field{margin-bottom:16px}

/* ---------- list rows ---------- */
.row{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:none}
.chk{width:20px;height:20px;border:1.5px solid var(--line);border-radius:50%;cursor:pointer;flex:none;margin-top:3px;display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:.18s}
.chk.on{background:var(--ink);border-color:var(--ink);color:#fff}
.row .t{font-size:15.5px;line-height:1.5}
.row .m{font-size:12.5px;color:var(--ink3);margin-top:3px}
.row.done .t{color:var(--ink3);text-decoration:line-through}
.x{font-size:12.5px;color:var(--ink3);cursor:pointer;background:none;border:none;font-family:inherit;padding:0}
.x:hover{color:var(--ink)}

/* ---------- pick card ---------- */
.pick{background:#fff;border-radius:24px;padding:28px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 34px rgba(0,0,0,.05)}
.pick .tag{display:inline-block;font-size:11.5px;color:var(--ink2);border:1px solid var(--line2);border-radius:999px;padding:3px 11px;margin-bottom:14px}
.pick h3{font-size:20px;line-height:1.4;margin:0 0 14px}
.pick .lbl{font-size:12px;color:var(--ink3);letter-spacing:.08em;margin:14px 0 4px}
.pick .val{font-size:14.5px;color:var(--ink2);margin:0}
.pick .acts{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}

/* ---------- chips / stats ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:12.5px;color:var(--ink2);background:var(--bg2);border-radius:999px;padding:5px 12px}
.stat{display:flex;gap:26px;flex-wrap:wrap}
.stat div{font-size:13px;color:var(--ink2)}
.stat b{display:block;font-size:26px;font-weight:600;color:var(--ink);letter-spacing:-.02em}

/* ---------- table-ish ---------- */
.li{display:grid;grid-template-columns:26px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border:none}
.li .n{font-size:12.5px;color:var(--ink3);padding-top:2px}
.li .h{font-size:15.5px;font-weight:500;margin:0 0 4px}
.li .d{font-size:14px;color:var(--ink2);margin:0}

footer{border-top:1px solid var(--line2);margin-top:40px;padding:32px 0 60px;font-size:12.5px;color:var(--ink3)}
footer .wrap{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
.hide{display:none!important}
@media(max-width:680px){
  .wrap{padding:0 18px}
  section{padding:56px 0}
  section.tight{padding:36px 0}
  .hero{padding:64px 0 40px}
  .lead{font-size:17.5px}
  .qbox{padding:22px}
  .card,.pick,.entry{padding:22px;border-radius:20px}
  .navrow{gap:14px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="wrap navrow">
    <div class="brand" data-act="go" data-arg="home">苏小七<em>内容工作台</em></div>
    <nav class="tabs" id="tabs"></nav>
    <button class="mini" data-act="export">备份</button>
  </div>
</header>

<main id="app"></main>

<footer><div class="wrap">
  <span>苏小七 · 内容工作台　v3</span>
  <span>数据只存在你这台电脑的浏览器里，换电脑前先点右上角「备份」</span>

  /* ---- 口播 ---- */

  {id:'p15',track:'生活',unit:'变现与闭环',title:'30 岁以后，我把「忙」换成了「排期」',why:'把情绪词换成方法词，容易涨粉也容易接到合作。',hook:'忙不是勋章，忙是没排期。'},

  {id:'p25',track:'测评',unit:'变现与闭环',title:'平价替代到底值不值，我按使用次数算了一遍',why:'把主观感受换成可算的账，可信度立刻不同。',hook:'这东西值不值，别问价格，问你会用多少次。'},

  {id:'p32',track:'剧情',unit:'心法与底层',title:'「我先看看」背后的四种意思',why:'把一句常见话拆出多层含义，一个人也能演出四个人。',hook:'「我先看看」这四个字，至少有四种意思。'},

    if(!o.vault || !o.vault.length) o.vault = VAULT0.slice();
    return o;
  }catch(e){ return fresh(); }

function esc(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function today(){
  var d = new Date();
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function poolFor(){
  var t = S.track;
  return POOL.filter(function(p){ return !t || p.track === t || p.track === '通用'; });
}
function todays(){
  var a = poolFor(), out = [], n = Math.min(3, a.length);
  for(var i=0;i<n;i++) out.push(a[(S.off + i*7) % a.length]);
  return out;
}

function classify(){
  var lines = S.cmt.split(/\n+/).map(function(s){ return s.trim(); }).filter(function(s){ return s.length>1; });
  var out = {'求方法':[], '说自己':[], '反对质疑':[], '要资源':[]};
  lines.forEach(function(l){
    var hit = null;
    for(var k in CM){
      for(var i=0;i<CM[k].length;i++){
        if(l.indexOf(CM[k][i]) >= 0){ hit = k; break; }
      }
      if(hit) break;
    }

  });
  var freq = {};
  lines.forEach(function(l){
    var zh = l.replace(/[^\u4e00-\u9fa5]/g,' ');
    zh.split(/\s+/).forEach(function(seg){
      for(var i=0;i<seg.length-1;i++){
        var g = seg.substr(i,2);
        if(STOP.indexOf(g) >= 0) continue;
        freq[g] = (freq[g]||0)+1;
      }
    });
  });
  var words = Object.keys(freq).filter(function(w){ return freq[w]>=2; })
    .sort(function(a,b){ return freq[b]-freq[a]; }).slice(0,8);
  return {lines:lines, groups:out, words:words};
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if(!el) return;
  var act = el.getAttribute('data-act'), arg = el.getAttribute('data-arg');

  if(act === 'go'){ go(arg); return; }

  if(act === 'export'){
    var blob = new Blob([JSON.stringify(S,null,2)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '苏小七工作台备份-' + new Date().toISOString().slice(0,10) + '.json';
    a.click();
    return;
  }

  if(act === 'ans'){ var p = arg.split(':'); answerQuiz(+p[0], +p[1]); return; }
  if(act === 'resetQuiz'){ S.quiz=null; S.track=null; S.answers=[]; save(); go('quiz'); return; }

  if(act === 'take'){ takeTopic(arg,'今日选题'); return; }
  if(act === 'keep'){ takeTopic(arg,'先存着'); return; }
  if(act === 'reroll'){ S.off += 3; save(); go('daily'); return; }
  if(act === 'done'){
    S.list.forEach(function(x){ if(x.id===arg) x.done = !x.done; });
    save(); go('daily'); return;
  }
  if(act === 'del'){
    S.list = S.list.filter(function(x){ return x.id!==arg; });
    save(); go('daily'); return;
  }

  if(act === 'run'){
    var ta = document.getElementById('cmt');
    if(ta) S.cmt = ta.value;
    save(); go('comment'); return;
  }
  if(act === 'sample'){
    S.cmt = '我也是一发就没流量，不知道哪里错了\n这条讲得太对了，能不能出个模板\n求个链接，在哪买的\n说白了就是内容不行，扯这么多\n我也是这样，一模一样的开头\n我也是，每次开头都在报户口\n到底怎么改开头啊，有没有步骤\n多少钱，有没有清单\n这不对吧，我随便拍都有人看\n能分享下你的表格吗，我也想要';
    save(); go('comment'); return;
  }
  if(act === 'fromCmt'){
    var t = {求方法:'评论区问最多：到底怎么改', 说自己:'说的就是我的人，比你想象的多', 反对质疑:'有人不同意，我正面答一次', 要资源:'我把自己用的那份东西整理出来了'}[arg] || '从评论区来的一条';
    S.list.push({id:'t'+Date.now(), title:t, unit:'来自评论区 · '+arg, from:'评论区洞察', done:false});
    save(); go('daily'); return;
  }

  if(act === 'toggleAdd'){ var b = document.getElementById('addBox'); if(b) b.classList.toggle('hide'); return; }
  if(act === 'saveVault'){
    var ti = document.getElementById('vTitle'), hk = document.getElementById('vHook'),
        wy = document.getElementById('vWhy'), cp = document.getElementById('vCopy');
    if(!ti || !ti.value.trim()){ alert('先给它一句话标题'); return; }
    S.vault.unshift({id:'v'+Date.now(), title:ti.value.trim(), src:'我拆的',
      hook:hk?hk.value.trim():'', why:wy?wy.value.trim():'', copy:cp?cp.value.trim():'', st:[]});
    save(); go('vault'); return;
  }
  if(act === 'delVault'){
    S.vault = S.vault.filter(function(v){ return String(v.id)!==String(arg); });
    save(); go('vault'); return;
  }

  if(act === 'mq'){
    var q = arg.split(':');
    if(!S.money) S.money = {a:[-1,-1,-1]};
    S.money.a[+q[0]] = +q[1];
    save(); go('money'); return;
  }
  if(act === 'check'){
    if(!S.money || S.money.a.indexOf(-1) >= 0){ alert('三个问题都答一下'); return; }
    var a = S.money.a, title, body, next;
    if(a[1] === 0 && a[2] === 0){
      title = '你现在就能收第一笔钱：做一次一对一诊断';
      body = '已经有人主动开口问你了，这是最硬的信号——不用再做内容证明自己。先接三单试水，把每一次的问题记下来，那就是你未来的产品大纲。';
      next = '今晚的一步：把「我帮你看看，一次一小时」写成一句话，置顶在自己的评论区。';
    }else if(a[1] === 0 && a[2] !== 0){
      title = '先别接一对一，把这个问题做成内容';
      body = '有人问，但你不想一对一。那就用内容回答：同一个问题连做三条，看有没有第二批人来问。第二批比第一批重要。';
      next = '今晚的一步：把被问的那句话原封不动当标题，拍第一条。';
    }else if(a[1] === 1){
      title = '先攒证据，别急着定价';
      body = '问过一两次，说明有需求但不稳定。这时候定价容易定错——定高了没人买，定低了自己难受。先用三条内容把这个需求放大。';
      next = '今晚的一步：把这个问题拆成三条选题，一周内发完，看谁再来问。';
    }else if(a[0] >= 2 || a[2] === 1){
      title = '现在先不谈变现，把内容做到有人主动问';
      body = '这不是坏消息。没有需求信号的时候做产品，等于给空房间卖票。你现在唯一要练的是：一条视频让人看完、让人想存。';
      next = '今晚的一步：去第二块挑一条题，只做一件事——把开头第一句改到不像自我介绍。';
    }else{
      title = '先攒证据，别急着定价';
      body = '粉丝还少、也没人主动问，说明内容和人群还没对上。先别想卖什么，先想清楚你在替谁解决哪个具体麻烦。';
      next = '今晚的一步：回到第一块重测一次赛道，再看第二块的三条题。';
    }
    S.money = {a:S.money.a, title:title, body:body, next:next};
    save(); go('money'); return;
  }
});
